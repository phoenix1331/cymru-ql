"An ISO 8601 date, e.g. `2026-08-01`."
scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

"An ISO 8601 date and time with offset, e.g. `2026-08-01T13:30:00+00:00`."
scalar DateTimeTz @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTimeTz")

type Query {
    "Every season, newest first."
    seasons: [Season!]! @all @orderBy(column: "starts_on", direction: DESC)

    "A season by slug, e.g. `2026-27`."
    season(slug: String! @eq): Season @find

    "The three leagues in scope, by tier."
    leagues: [League!]! @all(scopes: ["ordered"])

    "A club by slug, e.g. `caernarfon-town`."
    club(slug: String! @eq): Club @find

    "Every club, alphabetically."
    clubs: [Club!]! @paginate @orderBy(column: "name")

    "A ground by slug, e.g. `the-oval-caernarfon`."
    ground(slug: String! @eq): Ground @find

    "Every ground, alphabetically."
    grounds: [Ground!]! @paginate @orderBy(column: "name")

    "A league in one season (current by default), with its clubs and table."
    league(slug: String!, season: String): LeagueSeason! @field(resolver: "App\\GraphQL\\Queries\\LeagueQuery")

    "A league table. Seasons without results list the recorded final positions with null stats."
    table(league: String!, season: String): [TableRow!]! @field(resolver: "App\\GraphQL\\Queries\\TableQuery")

    "The closest grounds to a ground by road, optionally only those used by one league's clubs."
    nearbyGrounds(
        ground: String!
        limit: Int! = 5 @rules(apply: ["integer", "between:1,50"])
        league: String
        season: String
    ): [Distance!]! @field(resolver: "App\\GraphQL\\Queries\\NearbyGroundsQuery")

    "Fixtures for a season (current by default) in kick off order, with optional filters."
    fixtures(
        season: String
        league: String
        club: String
        status: FixtureStatus
        from: DateTimeTz
        to: DateTimeTz
        round: Int
    ): [Fixture!]! @paginate(builder: "App\\GraphQL\\Queries\\FixturesQuery")

    "A fixture by id."
    fixture(id: ID! @eq): Fixture @find
}

type Subscription {
    "Score, minute and status changes for one fixture while it is being played."
    matchUpdated(fixtureId: ID!): Fixture
}

"A football season, August to May."
type Season {
    slug: String!
    name: String!
    startsOn: Date! @rename(attribute: "starts_on")
    endsOn: Date! @rename(attribute: "ends_on")
    isCurrent: Boolean! @rename(attribute: "is_current")
}

"A league in the Welsh pyramid. Tier 1 is the Cymru Premier."
type League {
    slug: String!
    name: String!
    tier: Int!
    region: String!
}

"A football ground. Some grounds are shared by more than one club."
type Ground {
    slug: String!
    name: String!
    town: String!
    latitude: Float!
    longitude: Float!
    capacity: Int
    opened: Int
    address: String
    description: String
    "Clubs that play their home games here."
    clubs: [Club!]! @hasMany
    "The closest other grounds by road."
    nearby(limit: Int! = 5 @rules(apply: ["integer", "between:1,50"])): [Distance!]! @field(resolver: "App\\GraphQL\\Queries\\NearbyGroundsQuery")
    "Distances to every ground in a league, nearest first."
    distancesInLeague(league: String!, season: String): [Distance!]! @field(resolver: "App\\GraphQL\\Queries\\LeagueDistancesQuery@fromGround")
}

"A football club."
type Club {
    slug: String!
    name: String!
    nickname: String
    "Primary club colour as a hex value, e.g. `#F1B434`."
    colour: String!
    founded: Int
    ground: Ground! @belongsTo
    "League membership by season."
    seasons: [ClubSeason!]! @hasMany(relation: "clubSeasons")
    "The league the club plays in for a season (current by default)."
    league(season: String): LeagueSeason @field(resolver: "App\\GraphQL\\Queries\\ClubLeagueQuery")
    "Road distance to every other ground in the club's league for a season: its away trips."
    awayTrips(season: String): [Distance!]! @field(resolver: "App\\GraphQL\\Queries\\LeagueDistancesQuery@awayTrips")
}

"A club's league for one season, with its final position once the season is over."
type ClubSeason {
    club: Club! @belongsTo
    season: Season! @belongsTo
    league: League! @belongsTo
    position: Int
}

"A league in one season."
type LeagueSeason {
    league: League!
    season: Season!
    "Clubs in the league that season, alphabetically."
    clubs: [Club!]! @method
    "The league table for that season."
    table: [TableRow!]! @method
}

"One line of a league table. Stats are null when only the final position is recorded."
type TableRow {
    position: Int!
    club: Club!
    played: Int
    won: Int
    drawn: Int
    lost: Int
    goalsFor: Int
    goalsAgainst: Int
    goalDifference: Int @method
    points: Int
    "Last five results, oldest first: W, D or L."
    form: [String!]
}

"Distance from one ground to another. Road distance can differ slightly by direction."
type Distance {
    from: Ground! @belongsTo(relation: "fromGround")
    to: Ground! @belongsTo(relation: "toGround")
    roadKm: Float! @rename(attribute: "road_km")
    straightKm: Float! @rename(attribute: "straight_km")
}

"A match between two clubs. Scores are null until it kicks off."
type Fixture {
    id: ID!
    round: Int!
    kicksOffAt: DateTimeTz! @rename(attribute: "kicks_off_at")
    status: FixtureStatus!
    "Match minute while live, 90 once finished."
    minute: Int
    homeScore: Int @rename(attribute: "home_score")
    awayScore: Int @rename(attribute: "away_score")
    homeClub: Club! @belongsTo
    awayClub: Club! @belongsTo
    ground: Ground! @belongsTo
    league: League! @belongsTo
    season: Season! @belongsTo
    "Kick off, goals, cards, half time and full time, in match order."
    events: [MatchEvent!]! @hasMany
}

"Something that happened in a match, with the score after it."
type MatchEvent {
    id: ID!
    type: MatchEventType!
    minute: Int!
    homeScore: Int! @rename(attribute: "home_score")
    awayScore: Int! @rename(attribute: "away_score")
    description: String
    "The club the event belongs to; for an own goal, the club credited with it."
    club: Club @belongsTo
    fixture: Fixture! @belongsTo
}

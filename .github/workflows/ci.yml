name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --no-progress
      - run: npm ci

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  coverage:
    name: Pest with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate

      # Tests run on in-memory SQLite (phpunit.xml), so no database server is needed.
      - name: Pest (90% minimum line coverage on app/)
        shell: bash
        run: php artisan test --coverage --min=90 | tee coverage.txt

  app:
    name: Clone, setup and browser smoke test
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The MySQL server preinstalled on the Ubuntu runner, no service containers.
      - name: Start MySQL and create the database
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE DATABASE cymruql CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      # The documented path: composer setup installs, migrates, seeds and builds.
      - name: composer setup
        run: composer setup

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        env:
          CI: true
        run: npm run test:e2e
